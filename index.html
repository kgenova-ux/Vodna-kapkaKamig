<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пътешествието на капчицата</title>
<style>body{font-family:Arial,sans-serif;background:#f8fafc;color:#172033;max-width:760px;margin:auto;padding:20px}.sky{height:180px;background:linear-gradient(#dbeafe 68%,#bbf7d0 68%);border-radius:20px;position:relative}.sun{position:absolute;right:20px;font-size:45px}.cloud{position:absolute;left:42%;top:35px;font-size:70px}.ground{position:absolute;bottom:10px;width:100%;text-align:center;font-size:30px}.panel{background:#eff6ff;padding:20px;border-radius:24px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice,button{padding:14px;border-radius:14px;border:2px solid #bfdbfe;background:white;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.feedback{padding:14px;margin-top:12px;border-radius:14px;background:white}.ok{background:#f0fdf4;border:2px solid #86efac}.try{background:#fffbeb;border:2px solid #fde68a}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.badge{padding:9px;background:white;border-radius:12px;text-align:center;font-size:13px}.done{background:#f0fdf4}.sort{display:flex;flex-wrap:wrap;gap:8px;min-height:55px;padding:10px;border:2px dashed #bfdbfe;border-radius:14px}@media(max-width:550px){.choices{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><h1>💧 Пътешествието на капчицата</h1><p>Помогни на капчицата да завърши кръговрата на водата!</p><div>💧 Капки: <b id="score">0</b>/8</div><div class="cards" id="badges"></div><main class="panel" id="game"></main>
<script>
let score=0,stage=0,extra=false,chosen=[];const g=document.getElementById('game'),s=document.getElementById('score'),bd=document.getElementById('badges');
function badges(){let a=['☀️ Изпаряване','☁️ Облак','🌧️ Валеж','🔄 Кръговрат'];bd.innerHTML=a.map((x,i)=>`<div class="badge ${i<stage?'done':''}">${i<stage?'✓ ':''}${x}</div>`).join('');s.textContent=score}
function scene(){return '<div class="sky"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="ground">🌱 🌊 🌿</div></div>'}
function add(){score=Math.min(8,score+1);badges()}
function q(title,text,opts,correct,next,focus=false){g.innerHTML=scene()+`<h2>${title}</h2><p>${text}</p><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join('')}</div><div id="fb" class="feedback">Помисли и избери.</div>`;g.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let f=document.getElementById('fb');if(+b.dataset.i===correct){add();f.className='feedback ok';f.textContent='🎉 Точно така!';g.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(next,400)}else{f.className='feedback try';f.textContent=focus?'Помисли какво пада от облаците и стига до земята. Опитай отново.':'Опитай отново. Помисли какво се случва с водата.';if(focus&&!extra)setTimeout(extraQ,650)}})}
function m1(){stage=0;badges();q('Мисия 1: ☀️ Изпаряване','Слънцето нагрява водата. Какво става с част от нея?',['🧊 Превръща се в лед','💨 Изпарява се във въздуха','❌ Изчезва завинаги'],1,m2)}
function m2(){stage=1;add();badges();q('Мисия 2: ☁️ Облакът','Какво може да стане с водната пара, когато се охлади?',['🏖️ Да се превърне в пясък','🌫️ Да изчезне завинаги','💧 Да образува малки водни капки'],2,m3)}
function m3(){stage=2;add();badges();q('Мисия 3: 🌧️ Спаси облака!','Облакът е пълен с водни капки. Как водата може да се върне на земята?',['☀️ Като слънчева светлина','🌧️ Като дъжд','💨 Като сух въздух'],1,m4,true)}
function extraQ(){extra=true;q('💧 Допълнителна мисия','Капките в облака стават много. Какво ще видиш, когато водата се върне на земята?',['🌧️ Дъжд','☀️ Слънчева светлина','💨 Сух въздух'],0,m4)}
function m4(){stage=3;add();badges();chosen=[];let a=[['e','☀️ Изпаряване'],['c','☁️ Водни капки в облака'],['r','🌧️ Дъжд'],['w','🌊 Вода на земята']].sort(()=>Math.random()-.5);g.innerHTML='<h2>Мисия 4: 🔄 Подреди кръговрата</h2><p>Натискай картите в правилния ред.</p><div id="pool" class="sort"></div><div id="picked" class="sort"></div><div id="fb" class="feedback">Започни с това, което прави слънцето.</div><button id="check" class="primary">Провери</button>';let p=document.getElementById('pool'),z=document.getElementById('picked');a.forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{b.disabled=true;chosen.push(x[0]);z.innerHTML+=`<span>${x[1]} → </span>`};p.appendChild(b)});document.getElementById('check').onclick=()=>{let f=document.getElementById('fb');if(chosen.join('')==='ecrw'){add();stage=4;badges();f.className='feedback ok';f.textContent='🏆 Браво! Завърши кръговрата!';setTimeout(finish,500)}else{f.className='feedback try';f.textContent='Почти! Слънцето нагрява → водни капки → дъжд → вода на земята.'}}}
function finish(){g.innerHTML=scene()+`<h2>🏆 Браво, малка капчице!</h2><p>Събра <b>${score}</b> от 8 капки.</p><div class="feedback ok">💧 Изпаряване → ☁️ водни капки → 🌧️ валеж → 🌊 вода на земята</div><br><button id="again" class="primary">Играй отново</button>`;document.getElementById('again').onclick=start}
function start(){score=0;stage=0;extra=false;chosen=[];badges();m1()}start();
</script></body></html>
